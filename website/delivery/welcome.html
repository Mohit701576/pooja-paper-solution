<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pooja Paper Solution - Delivery</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}


/* =====================================================
   MAIN SCREEN
===================================================== */

.welcome-screen {
    position: relative;
    width: 100%;
    height: 100dvh;
    min-height: 560px;
    overflow: hidden;
    perspective: 1000px;
    background:
        linear-gradient(
            to bottom,
            #dff5ff 0%,
            #f5fbff 52%,
            #eaf4f8 100%
        );
}


/* =====================================================
   BRAND AREA
===================================================== */

.brand-area {
    position: absolute;
    top: 7%;
    left: 50%;
    transform: translateX(-50%);
    width: 95%;
    text-align: center;
    z-index: 30;
}

.brand {
    font-size: clamp(28px, 4vw, 58px);
    font-weight: 900;
    letter-spacing: 2px;
    color: #111827;
    text-shadow:
        0 3px 8px rgba(0,0,0,0.12);
}

.brand span {
    display: inline-block;
}


/* =====================================================
   INFO
===================================================== */

.info-container {
    position: absolute;
    top: 30.5%;
    left: 50%;
    transform: translateX(-50%);
    width: 92%;
    text-align: center;
    z-index: 35;
}

.subtitle {
    font-size: clamp(16px, 2vw, 27px);
    font-weight: 600;
    color: #374151;
    line-height: 1.5;
}

.tagline {
    margin-top: 8px;
    font-size: clamp(12px, 1.5vw, 18px);
    color: #6b7280;
}


/* =====================================================
   CITY / BUILDINGS
===================================================== */

.city {
    position: absolute;
    bottom: 34%;
    left: 0;

    width: 100%;
    height: 115px;

    display: flex;
    align-items: flex-end;
    gap: 7px;

    opacity: 0.30;

    z-index: 2;

    pointer-events: none;
}

.building {
    position: relative;
    flex: 1;
    min-width: 30px;

    background:
        linear-gradient(
            to bottom,
            #7c8794,
            #59636e
        );

    border-radius: 3px 3px 0 0;
}

.building:nth-child(1) {
    height: 58%;
}

.building:nth-child(2) {
    height: 82%;
}

.building:nth-child(3) {
    height: 66%;
}

.building:nth-child(4) {
    height: 94%;
}

.building:nth-child(5) {
    height: 70%;
}

.building:nth-child(6) {
    height: 88%;
}

.building:nth-child(7) {
    height: 62%;
}

.building:nth-child(8) {
    height: 97%;
}

.building:nth-child(9) {
    height: 73%;
}

.building:nth-child(10) {
    height: 90%;
}

.building:nth-child(11) {
    height: 64%;
}

.building:nth-child(12) {
    height: 84%;
}


/* =====================================================
   BUILDING WINDOWS
===================================================== */

.building::before {
    content: "";

    position: absolute;
    top: 12px;
    left: 10px;

    width: calc(100% - 20px);
    height: calc(100% - 22px);

    background-image:
        linear-gradient(
            rgba(255,255,255,0.65) 2px,
            transparent 2px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,0.65) 2px,
            transparent 2px
        );

    background-size: 15px 17px;

    opacity: 0.7;
}


/* =====================================================
   ROAD AREA
===================================================== */

.road-area {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 37%;
    min-height: 215px;

    overflow: hidden;

    z-index: 5;

    background:
        linear-gradient(
            to bottom,
            #d8e5ea 0%,
            #c9d9df 14%,
            #b7c8cf 15%,
            #aabdc5 100%
        );
}


/* =====================================================
   SIDEWALK
===================================================== */

.sidewalk {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 28%;

    background:
        repeating-linear-gradient(
            90deg,
            #dfe8eb 0px,
            #dfe8eb 50px,
            #c8d4d9 51px,
            #c8d4d9 53px
        );

    border-top: 2px solid rgba(0,0,0,0.08);

    z-index: 1;
}


/* =====================================================
   ROAD
===================================================== */

.road {
    position: absolute;

    left: -5%;
    bottom: -7%;

    width: 110%;
    height: 64%;

    background:
        linear-gradient(
            to bottom,
            #50565c 0%,
            #3d4348 55%,
            #2f3438 100%
        );

    transform:
        perspective(650px)
        rotateX(7deg);

    border-top: 3px solid rgba(255,255,255,0.18);

    z-index: 1;
}


/* =====================================================
   ROAD LANE MARKING
===================================================== */

.road::after {
    content: "";

    position: absolute;

    left: -5%;
    top: 48%;

    width: 110%;
    height: 5px;

    background:
        repeating-linear-gradient(
            90deg,
            rgba(255,255,255,0.75) 0px,
            rgba(255,255,255,0.75) 70px,
            transparent 70px,
            transparent 135px
        );

    opacity: 0.8;
}


/* =====================================================
   DELIVERY GROUP
   IMPORTANT:
   IT IS OUTSIDE ROAD-AREA
   SO IT CAN STAY ABOVE BUILDINGS
===================================================== */

.delivery-group {
    position: absolute;

    left: -360px;

    /*
       Because delivery-group is now directly inside
       welcome-screen, bottom is calculated from screen.
    */
    bottom: 8%;

    width: 270px;
    height: auto;

    z-index: 99999;

    pointer-events: none;

    animation:
        deliveryRide
        6s
        cubic-bezier(.20,.70,.30,1)
        forwards;
}


/* =====================================================
   DELIVERY IMAGE
===================================================== */

.delivery-image {
    position: relative;

    display: block;

    width: 100%;
    height: auto;

    object-fit: contain;

    z-index: 99999;

    filter:
        drop-shadow(
            0 10px 8px rgba(0,0,0,0.25)
        );

    animation:
        riderBounce
        0.32s
        ease-in-out
        infinite
        alternate;
}


/* =====================================================
   RIDER BOUNCE
===================================================== */

@keyframes riderBounce {

    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-3px);
    }
}


/* =====================================================
   DESKTOP DELIVERY ANIMATION
===================================================== */

@keyframes deliveryRide {

    0% {
        left: -360px;
        transform:
            translateY(0)
            scale(0.90);
    }

    18% {
        left: 10%;
        transform:
            translateY(-3px)
            scale(0.95);
    }

    42% {
        left: 36%;
        transform:
            translateY(0)
            scale(1);
    }

    65% {
        left: 61%;
        transform:
            translateY(-3px)
            scale(1.02);
    }

    100% {
        left: calc(100% + 30px);
        transform:
            translateY(0)
            scale(1.04);
    }
}


/* =====================================================
   LOADING AREA
===================================================== */

.loading-area {
    position: absolute;

    left: 50%;
    bottom: 5%;

    transform: translateX(-50%);

    text-align: center;

    z-index: 150;
}

.loading-text {
    font-size: 13px;
    color: #6b7280;
    font-weight: 600;
}

.loading-dots {
    margin-top: 7px;
    display: flex;
    justify-content: center;
    gap: 5px;
}

.loading-dots span {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #374151;

    animation:
        loadingDot
        1s
        infinite
        ease-in-out;
}

.loading-dots span:nth-child(2) {
    animation-delay: 0.15s;
}

.loading-dots span:nth-child(3) {
    animation-delay: 0.30s;
}

@keyframes loadingDot {

    0%,
    80%,
    100% {
        transform: translateY(0);
        opacity: 0.35;
    }

    40% {
        transform: translateY(-5px);
        opacity: 1;
    }
}


/* =====================================================
   EXIT ANIMATION
===================================================== */

.welcome-screen.exit {
    animation:
        screenExit
        0.8s
        ease
        forwards;
}

@keyframes screenExit {

    from {
        opacity: 1;
        transform: scale(1);
    }

    to {
        opacity: 0;
        transform: scale(1.03);
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .welcome-screen {
        min-height: 500px;
    }


    /* BRAND */

    .brand-area {
        top: 7%;
        width: 94%;
    }

    .brand {
        font-size: clamp(24px, 7vw, 34px);
        letter-spacing: 1px;
        line-height: 1.2;
    }


    /* INFO */

    .info-container {
        top: 27%;
        width: 90%;
    }

    .subtitle {
        font-size: 15px;
        line-height: 1.4;
    }

    .tagline {
        font-size: 11px;
        margin-top: 6px;
    }


    /* CITY */

    .city {
        bottom: 38%;

        height: 70px;

        gap: 3px;

        z-index: 2;
    }


    /* ROAD */

    .road-area {
        height: 40%;
        min-height: 215px;

        z-index: 5;
    }


    /* DELIVERY */

    .delivery-group {
        bottom: 9%;

        width: 240px;

        z-index: 99999;

        animation-name: deliveryRideMobile;
    }


    /* MOBILE DELIVERY ANIMATION */

    @keyframes deliveryRideMobile {

        0% {
            left: -245px;
            transform:
                translateY(0)
                scale(0.70);
        }

        18% {
            left: 2%;
            transform:
                translateY(-2px)
                scale(0.72);
        }

        42% {
            left: 27%;
            transform:
                translateY(0)
                scale(0.74);
        }

        65% {
            left: 53%;
            transform:
                translateY(-2px)
                scale(0.75);
        }

        100% {
            left: calc(100% + 15px);
            transform:
                translateY(0)
                scale(0.76);
        }
    }


    /* LOADING */

    .loading-area {
        bottom: 5%;
    }

    .loading-text {
        font-size: 11px;
    }
}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media (max-width: 380px) {

    .brand {
        font-size: 23px;
    }

    .subtitle {
        font-size: 14px;
    }

    .tagline {
        font-size: 10px;
    }


    .delivery-group {
        bottom: 10%;
        width: 220px;
        z-index: 99999;
    }
}

</style>
</head>


<body>

<div class="welcome-screen" id="welcomeScreen">


    <!-- =================================================
         BRAND
    ================================================== -->

    <div class="brand-area">

        <div class="brand">
            <span>POOJA PAPER SOLUTION</span>
        </div>

    </div>


    <!-- =================================================
         INFO
    ================================================== -->

    <div class="info-container">

        <div class="subtitle">
            Your trusted partner for quality disposable products
        </div>

        <div class="tagline">
            Fast Delivery • Quality Products • Easy Ordering
        </div>

    </div>


    <!-- =================================================
         CITY / BUILDINGS
    ================================================== -->

    <div class="city">

        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>

    </div>


    <!-- =================================================
         ROAD
    ================================================== -->

    <div class="road-area">

        <div class="sidewalk"></div>

        <div class="road"></div>

        <div class="loading-area">

            <div class="loading-text">
                Preparing your experience...
            </div>

            <div class="loading-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>

    </div>


    <!-- =================================================
         DELIVERY BOY

         IMPORTANT:
         THIS IS OUTSIDE ROAD-AREA

         Therefore:
         Building z-index = 2
         Road z-index = 5
         Delivery z-index = 99999

         Delivery image will appear in front.
    ================================================== -->

    <div class="delivery-group" id="deliveryGroup">

        <img
            src="delivery-boy.png"
            alt="Delivery Partner"
            class="delivery-image"
        >

    </div>


</div>


<script>

/* =====================================================
   POOJA PAPER SOLUTION
   WELCOME SCREEN
===================================================== */

const welcomeScreen =
    document.getElementById("welcomeScreen");


/*
   Delivery animation = 6 seconds

   After animation finishes,
   open index.html
*/

const duration = 5000;


/* =====================================================
   REDIRECT
===================================================== */

setTimeout(function () {

    welcomeScreen.classList.add("exit");

    setTimeout(function () {

        window.location.href = "login.html";

    }, 800);

}, duration);

</script>

</body>
</html>
